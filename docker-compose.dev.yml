version: '3.8'

services:
  blockchain:
    build:
      context: ./blockchain
      dockerfile: Dockerfile
    container_name: ethvana-blockchain-dev
    ports:
      - "8545:8545"
    networks:
      - ethvana-network
    volumes:
      - ./blockchain:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    command: npx hardhat node

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: ethvana-backend-dev
    ports:
      - "8000:8000"
    networks:
      - ethvana-network
    depends_on:
      - blockchain
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - BLOCKCHAIN_RPC_URL=http://blockchain:8545
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: ethvana-frontend-dev
    ports:
      - "3000:3000"
    networks:
      - ethvana-network
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://backend:8000
    command: npm run dev

networks:
  ethvana-network:
    driver: bridge
