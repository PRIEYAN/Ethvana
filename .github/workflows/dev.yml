name: Development Testing

on:
  push:
    branches: [develop, feature/*]
  pull_request:
    branches: [develop]

jobs:
  frontend-dev:
    name: Frontend Dev Testing
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run dev mode
        run: |
          npm run dev &
          DEV_PID=$!
          sleep 10
          kill $DEV_PID || true

      - name: Lint
        run: npm run lint

  backend-dev:
    name: Backend Dev Testing
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run dev mode
        run: |
          npm run dev &
          DEV_PID=$!
          sleep 10
          kill $DEV_PID || true
        continue-on-error: true

      - name: Run tests
        run: npm test || echo "No tests configured"

  blockchain-dev:
    name: Blockchain Dev Testing
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./blockchain

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: blockchain/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npx hardhat compile

      - name: Run local node
        run: |
          npx hardhat node &
          NODE_PID=$!
          sleep 10
          kill $NODE_PID || true

      - name: Run tests
        run: npx hardhat test || echo "No tests found"

  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: [frontend-dev, backend-dev, blockchain-dev]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start services
        run: docker-compose -f docker-compose.dev.yml up -d

      - name: Wait for services
        run: sleep 30

      - name: Check services health
        run: |
          docker-compose -f docker-compose.dev.yml ps
          curl -f http://localhost:3000 || exit 1
          curl -f http://localhost:8545 || exit 1

      - name: Stop services
        run: docker-compose -f docker-compose.dev.yml down
